<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gato en Bicicleta - Animacion 2D</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:#0f172a;color:#fff;text-align:center;overflow-x:hidden}h1{padding:22px 10px 6px;font-size:32px}p{opacity:.85;margin-bottom:16px}.scene{position:relative;width:min(960px,94vw);height:460px;margin:34px auto;border:0.33cm solid rgba(255,255,255,0.15);border-radius:28px;overflow:hidden;background:linear-gradient(#38bdf8 0%,#bae6fd 55%,#86efac 55%,#22c55e 100%);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 1px rgba(255,255,255,.45),inset 0 -1px 1px rgba(255,255,255,.15),0 8px 32px rgba(31,38,135,.25),0 20px 50px rgba(0,0,0,.45);transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s ease;transform-origin:center;cursor:zoom-in}.scene:hover{transform:scale(1.10);box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 12px 40px rgba(31,38,135,.35),0 28px 65px rgba(0,0,0,.55)}.scene::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent 48%);z-index:20}.sun{position:absolute;top:28px;right:36px;width:72px;height:72px;background:#fde047;border-radius:50%;box-shadow:0 0 40px #fde047}.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.95;animation:cloudMove linear infinite}.cloud1{width:110px;height:34px;top:48px;left:-140px;animation-duration:18s}.cloud2{width:80px;height:26px;top:105px;left:-100px;animation-duration:26s;animation-delay:5s}@keyframes cloudMove{to{transform:translateX(1150px)}}.road{position:absolute;bottom:0;left:0;right:0;height:150px;background:linear-gradient(#2563eb,#1d4ed8 60%,#1e40af)}.road:before{content:"";position:absolute;top:0;left:0;right:0;height:10px;background:#facc15}.dashes{position:absolute;top:72px;left:0;width:200%;height:14px;background:repeating-linear-gradient(90deg,#fff 0 70px,transparent 70px 130px);animation:roadMove .55s linear infinite}@keyframes roadMove{to{transform:translateX(-130px)}}.bike-wrap{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);animation:bob .45s ease-in-out infinite alternate;z-index:5}@keyframes bob{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-7px)}}.wheel,.pedal{transform-origin:center;transform-box:fill-box;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.controls{margin:20px}button{background:#2563eb;color:#fff;border:0;padding:12px 20px;border-radius:999px;font-size:16px;cursor:pointer;margin:0 6px}</style></head><body><h1>Gato montando una bicicleta</h1><p>Animacion 2D en HTML/CSS/SVG - Carretera azul - Borde liquid glass 0,33 cm - Pasa el cursor para zoom 10%</p><div class="scene"><div class="sun"></div><div class="cloud cloud1"></div><div class="cloud cloud2"></div><div class="road"><div class="dashes" id="dashes"></div></div><div class="bike-wrap"><svg width="430" height="280" viewBox="0 0 430 280"><g class="wheel"><circle cx="105" cy="215" r="52" fill="none" stroke="#111827" stroke-width="7"/><circle cx="105" cy="215" r="6" fill="#111827"/><g stroke="#e5e7eb" stroke-width="3"><line x1="105" y1="165" x2="105" y2="265"/><line x1="55" y1="215" x2="155" y2="215"/><line x1="70" y1="180" x2="140" y2="250"/><line x1="140" y1="180" x2="70" y2="250"/></g></g><g class="wheel"><circle cx="325" cy="215" r="52" fill="none" stroke="#111827" stroke-width="7"/><circle cx="325" cy="215" r="6" fill="#111827"/><g stroke="#e5e7eb" stroke-width="3"><line x1="325" y1="165" x2="325" y2="265"/><line x1="275" y1="215" x2="375" y2="215"/><line x1="290" y1="180" x2="360" y2="250"/><line x1="360" y1="180" x2="290" y2="250"/></g></g><path d="M105 215 L195 130 L325 215 L215 215 L165 145" fill="none" stroke="#ef4444" stroke-width="9" stroke-linejoin="round"/><line x1="300" y1="125" x2="325" y2="215" stroke="#ef4444" stroke-width="9"/><rect x="175" y="118" width="55" height="11" rx="6" fill="#111827"/><g class="pedal"><circle cx="215" cy="215" r="20" fill="none" stroke="#f59e0b" stroke-width="5"/><line x1="215" y1="195" x2="215" y2="235" stroke="#111827" stroke-width="5"/></g><ellipse cx="215" cy="118" rx="62" ry="42" fill="#f97316"/><ellipse cx="225" cy="126" rx="38" ry="24" fill="#ffedd5"/><path d="M250 105 L292 122 L315 122" fill="none" stroke="#f97316" stroke-width="14" stroke-linecap="round"/><circle cx="275" cy="72" r="38" fill="#fb923c"/><polygon points="248,48 240,12 272,32" fill="#fb923c"/><polygon points="298,42 312,10 322,42" fill="#fb923c"/><circle cx="262" cy="68" r="5" fill="#111827"/><circle cx="292" cy="68" r="5" fill="#111827"/><ellipse cx="277" cy="80" rx="6" ry="4" fill="#ec4899"/><path d="M268 90 Q277 97 288 90" fill="none" stroke="#7c2d12" stroke-width="3"/><text x="205" y="45" font-size="24">😻</text></svg></div></div><div class="controls"><button onclick="setSpeed(0.35)">Rapido</button><button onclick="setSpeed(0.7)">Normal</button><button onclick="setSpeed(1.4)">Lento</button><button onclick="meow()">Miau!</button></div><p id="msg">Haz clic en Miau o cambia la velocidad</p><script>function setSpeed(s){document.querySelectorAll('.wheel,.pedal').forEach(e=>e.style.animationDuration=s+'s');document.getElementById('dashes').style.animationDuration=(s*0.8)+'s'}function meow(){document.getElementById('msg').textContent='Miauuu! Que divertido es pedalear!';try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(700,a.currentTime);o.frequency.exponentialRampToValueAtTime(350,a.currentTime+.35);g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.4);o.start();o.stop(a.currentTime+.4)}catch(e){}setTimeout(()=>document.getElementById('msg').textContent='Pedaleando por la carretera azul...',1800)}</script></body></html>
